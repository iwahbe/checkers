[workspace]
members = [".", "rt"]

[package]
name = "checkers"
version = "0.1.0"
edition = "2021"
description = "Checkers: a dependently typed, proof-carrying functional language"
license = "UNLICENSED"
publish = false

[[bin]]
name = "ckc"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[[test]]
name = "golden"
path = "tests/golden.rs"
harness = false

[features]
# Z3 is built from source and linked statically (D46). Turn it off to link a
# libz3 that is already installed instead: faster to build, for development.
default = ["static-z3"]
static-z3 = ["z3-sys/vendored"]

[dependencies]
mimalloc = { version = "0.1", default-features = false }
z3-sys = "0.14.1"
num-bigint = "0.4"
num-traits = "0.2"
checkers_rt = { path = "rt" }
cranelift-codegen = "0.137.1"
cranelift-frontend = "0.137.1"
cranelift-module = "0.137.1"
cranelift-jit = "0.137.1"
cranelift-object = "0.137.1"
cranelift-native = "0.137.1"
target-lexicon = "0.13.5"
