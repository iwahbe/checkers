[workspace]
members = [".", "rt"]

[package]
name = "checkers"
version = "0.1.0"
edition = "2021"
description = "Checkers: a dependently typed, proof-carrying functional language"
license = "UNLICENSED"
publish = false

[[bin]]
name = "ckc"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[[test]]
name = "golden"
path = "tests/golden.rs"
harness = false

[features]
# Z3 is built from source and linked statically (D46). Turn it off to link a
# libz3 that is already installed instead: faster to build, for development.
default = ["static-z3"]
static-z3 = ["z3-sys/vendored"]

[dependencies]
mimalloc = { version = "0.1", default-features = false }
z3-sys = "0.14.1"
num-bigint = "0.4"
num-traits = "0.2"
checkers_rt = { path = "rt" }
cranelift-codegen = "0.137.1"
cranelift-frontend = "0.137.1"
cranelift-module = "0.137.1"
cranelift-jit = "0.137.1"
cranelift-object = "0.137.1"
cranelift-native = "0.137.1"
target-lexicon = "0.13.5"

# `wait4` for a child's peak memory in tests/scaling.rs; already a dependency
# of the runtime (rt/).
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"

# Z3, built from source (`static-z3`), is optimized in development builds
# too: a debug Z3 is ~15 times slower, which can push a test's query past
# the safety timeout (SAFETY_MS) on a busy machine.
[profile.dev.package.z3-sys]
opt-level = 3
debug = false

# Cranelift and its register allocator are optimized in development builds
# too: compiling `check`s with an unoptimized code generator was most of a
# debug build's check time (11/15/2026).
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.cranelift-bforest]
opt-level = 3
[profile.dev.package.cranelift-entity]
opt-level = 3
[profile.dev.package.cranelift-jit]
opt-level = 3
[profile.dev.package.cranelift-module]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
