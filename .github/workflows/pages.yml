# The site (D131, SPEC §15.6), on GitHub Pages: the pages in `site/`, and
# the standard library's documentation by version:
#   /docs/dev/std/      `main`
#   /docs/vX.Y.Z/std/   each release, from the archive it attached (built by
#                       its own tools, so it never changes)
#   /docs/latest/std/   a copy of the highest release that isn't a
#                       pre-release; of `dev` before the first
# Nothing generated is kept in the repository.
#
# It builds nothing: it deploys a commit that passed CI on `main`, with the
# `ckc` and `checkers` that CI run uploaded. Which commit:
#   CI passed on `main`      that run's
#   a release is published   the release's (the release workflow starts this
#                            with `release`, since a release published with
#                            GITHUB_TOKEN starts no `release` event)
#   by hand                  `release`'s if given, else the latest that passed
name: Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release:
        description: "Deploy this release's commit (vX.Y.Z); empty for the latest that passed CI on main"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

# One deployment at a time; a newer one waits rather than cancelling.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    steps:
      - name: The CI run to deploy
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE: ${{ github.event.release.tag_name || inputs.release }}
        run: |
          if [ "$EVENT" = workflow_run ]; then
            run=$RUN_ID
            sha=$RUN_SHA
          else
            commit=()
            if [ -n "$RELEASE" ]; then
              commit=(--commit "$(gh api "repos/$REPO/commits/$RELEASE" --jq .sha)")
            fi
            read -r run sha < <(gh run list --repo "$REPO" --workflow ci.yml --branch main --event push \
              --status success "${commit[@]}" --limit 1 --json databaseId,headSha \
              --jq '.[0] | "\(.databaseId) \(.headSha)"')
          fi
          if [ -z "$run" ] || [ "$run" = null ]; then
            echo "::error::no CI run on main passed for ${RELEASE:-any commit}"
            exit 1
          fi
          echo "deploying $sha, with the tools of CI run $run"
          { echo "run=$run"; echo "sha=$sha"; } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ci.outputs.sha }}
          persist-credentials: false
      - name: Its tools
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ steps.ci.outputs.run }}
        run: |
          gh run download "$RUN" --repo "$REPO" --name tools-linux --dir "$RUNNER_TEMP/tools"
          chmod +x "$RUNNER_TEMP/tools/ckc" "$RUNNER_TEMP/tools/checkers"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
          echo "CHECKERS_STD=$PWD/stdlib" >> "$GITHUB_ENV"
      - name: Documentation by version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p _site/docs _pages
          cp site/*.md _pages/
          checkers doc stdlib -o _site/docs/dev --name std --root ../../.. --label dev
          latest=""
          versions=""
          for tag in $(gh release list --repo "$REPO" --exclude-drafts --limit 1000 \
                         --json tagName --jq '.[].tagName' | sort -rV); do
            archive="checkers-$tag-docs.tar.gz"
            if gh release download "$tag" --repo "$REPO" --pattern "$archive" --dir "$RUNNER_TEMP/releases"; then
              mkdir -p "_site/docs/$tag"
              tar -xzf "$RUNNER_TEMP/releases/$archive" -C "_site/docs/$tag"
              versions="$versions- [$tag](docs/$tag/std/index.md)"$'\n'
              case "$tag" in *-*) ;; *) latest="${latest:-$tag}" ;; esac
            else
              echo "::warning::release $tag has no $archive"
            fi
          done
          cp -R "_site/docs/${latest:-dev}" _site/docs/latest
          {
            echo
            echo "- [Latest](docs/latest/std/index.md): ${latest:-no release yet, so the same as \`dev\`}"
            echo "- [dev](docs/dev/std/index.md): \`main\`"
            echo
            echo "## Releases"
            echo
            echo "${versions:-None yet.}"
          } >> _pages/docs.md
      - name: The site
        run: checkers site _pages -o _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
